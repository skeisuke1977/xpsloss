[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xpsloss-starter"
version = "0.0.1"
description = "Independent, limited bulk dielectric-loss calculation starter"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.scripts]
xpsloss = "xpsloss.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
