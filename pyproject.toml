[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "xpsloss"
dynamic = ["version"]
description = "Dielectric response, bulk electron energy losses, fixed-depth and depth-averaged cross sections, and single-loss spectra for normal-emission XPS"
readme = "README.md"
license = "MIT AND CC-BY-4.0"
license-files = ["LICENSE", "NOTICES.md"]
authors = [{name = "Keisuke Sato"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.scripts]
xpsloss = "xpsloss.cli:main"

[project.urls]
Repository = "https://github.com/skeisuke1977/xpsloss"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "xpsloss.__version__"}

[tool.setuptools.package-data]
xpsloss = ["data/m4a_completed_comparisons.json"]
